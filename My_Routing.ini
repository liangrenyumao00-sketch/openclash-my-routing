[General]
#!NAME = My_Routing
#!DESC = 国内直连，常用服务分流，地区内自动备用；节点由原订阅更新
#!CONFIG = all
#!CRON = 0 4
RESTART = true
CHINA_IP_ROUTE = 0
CHINA_IP6_ROUTE = 0

[YAML]
proxy-groups!:
  - name: 节点选择
    type: select
    proxies: [自动选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 美国节点, 韩国节点, DIRECT]
    include-all: true

  - name: 自动选择
    type: url-test
    include-all: true
    empty-fallback: REJECT
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 香港节点
    type: select
    proxies: [香港自动]
    include-all: true
    empty-fallback: REJECT
    filter: '(?i)(香港|🇭🇰|(^|[^a-z])HK([^a-z]|$)|Hong ?Kong)'

  - name: 台湾节点
    type: select
    proxies: [台湾自动]
    include-all: true
    empty-fallback: REJECT
    filter: '(?i)(台湾|台灣|🇹🇼|(^|[^a-z])TW([^a-z]|$)|Taiwan)'

  - name: 日本节点
    type: select
    proxies: [日本自动]
    include-all: true
    empty-fallback: REJECT
    filter: '(?i)(日本|🇯🇵|(^|[^a-z])JP([^a-z]|$)|Japan|Tokyo)'

  - name: 新加坡节点
    type: select
    proxies: [新加坡自动]
    include-all: true
    empty-fallback: REJECT
    filter: '(?i)(新加坡|狮城|獅城|🇸🇬|(^|[^a-z])SG([^a-z]|$)|Singapore)'

  - name: 美国节点
    type: select
    proxies: [美国自动]
    include-all: true
    empty-fallback: REJECT
    filter: '(?i)(美国|美國|🇺🇸|(^|[^a-z])US([^a-z]|$)|United States|Los Angeles)'

  - name: 韩国节点
    type: select
    proxies: [韩国自动]
    include-all: true
    empty-fallback: REJECT
    filter: '(?i)(韩国|韓國|🇰🇷|(^|[^a-z])KR([^a-z]|$)|Korea|Seoul)'

  - name: 香港自动
    type: fallback
    include-all: true
    empty-fallback: REJECT
    filter: '(?i)(香港|🇭🇰|(^|[^a-z])HK([^a-z]|$)|Hong ?Kong)'
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 5000
    lazy: true

  - name: 台湾自动
    type: fallback
    include-all: true
    empty-fallback: REJECT
    filter: '(?i)(台湾|台灣|🇹🇼|(^|[^a-z])TW([^a-z]|$)|Taiwan)'
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 5000
    lazy: true

  - name: 日本自动
    type: fallback
    include-all: true
    empty-fallback: REJECT
    filter: '(?i)(日本|🇯🇵|(^|[^a-z])JP([^a-z]|$)|Japan|Tokyo)'
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 5000
    lazy: true

  - name: 新加坡自动
    type: fallback
    include-all: true
    empty-fallback: REJECT
    filter: '(?i)(新加坡|狮城|獅城|🇸🇬|(^|[^a-z])SG([^a-z]|$)|Singapore)'
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 5000
    lazy: true

  - name: 美国自动
    type: fallback
    include-all: true
    empty-fallback: REJECT
    filter: '(?i)(美国|美國|🇺🇸|(^|[^a-z])US([^a-z]|$)|United States|Los Angeles)'
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 5000
    lazy: true

  - name: 韩国自动
    type: fallback
    include-all: true
    empty-fallback: REJECT
    filter: '(?i)(韩国|韓國|🇰🇷|(^|[^a-z])KR([^a-z]|$)|Korea|Seoul)'
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 5000
    lazy: true

  - name: ChatGPT
