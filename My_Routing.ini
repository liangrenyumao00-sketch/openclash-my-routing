rules!:
  - RULE-SET,private,DIRECT
  - DOMAIN-SUFFIX,lan,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN-SUFFIX,home.arpa,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - RULE-SET,openai,ChatGPT
  - RULE-SET,anthropic,Claude
  - RULE-SET,google-gemini,Gemini
  - RULE-SET,ai,AI服务
  - RULE-SET,steam-cn,国内网站
  - RULE-SET,games-cn,国内网站
  - RULE-SET,dev-cn,国内网站
  - RULE-SET,microsoft-cn,国内网站
  - RULE-SET,apple-cn,国内网站
  - RULE-SET,youtube,YouTube
  - RULE-SET,netflix,Netflix
  - RULE-SET,disney,Disney+
  - RULE-SET,spotify,Spotify
  - RULE-SET,scholar,学术网站
  - RULE-SET,google,谷歌服务
  - RULE-SET,telegram,Telegram
  - RULE-SET,twitter,社交通讯
  - RULE-SET,facebook,社交通讯
  - RULE-SET,tiktok,TikTok
  - RULE-SET,social,社交通讯
  - RULE-SET,github,开发平台
  - RULE-SET,paypal,金融支付
  - RULE-SET,steam,游戏平台
  - RULE-SET,games,游戏平台
  - RULE-SET,onedrive,网盘下载
  - RULE-SET,dropbox,网盘下载
  - RULE-SET,mega,网盘下载
  - RULE-SET,bahamut,动漫平台
  - RULE-SET,biliintl,动漫平台
  - RULE-SET,microsoft,微软服务
  - RULE-SET,apple,苹果服务
  - RULE-SET,dev,开发平台
  - RULE-SET,foreign,国外网站
  - RULE-SET,china,国内网站
  # Any remaining named destination uses the foreign fallback.
  # Only traffic without a known domain reaches the China IP rule.
  - DOMAIN-REGEX,.+,国外网站
  - RULE-SET,china-ip,国内网站,no-resolve
  - MATCH,国外网站
