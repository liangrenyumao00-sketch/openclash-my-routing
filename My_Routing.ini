[General]
#!NAME = My_Routing
#!DESC = 自用分组与分流；节点仍由原订阅更新
#!CONFIG = all
#!CRON = 0 4
RESTART = true

[YAML]
proxy-groups!:
  - name: 节点选择
    type: select
    proxies: [自动选择, DIRECT]
    include-all: true

  - name: 自动选择
    type: url-test
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 香港节点
    type: select
    include-all: true
    empty-fallback: REJECT
    filter: '(?i)(香港|🇭🇰|(^|[^a-z])HK([^a-z]|$)|Hong ?Kong)'

  - name: 台湾节点
    type: select
    include-all: true
    empty-fallback: REJECT
    filter: '(?i)(台湾|台灣|🇹🇼|(^|[^a-z])TW([^a-z]|$)|Taiwan)'

  - name: 日本节点
    type: select
    include-all: true
    empty-fallback: REJECT
    filter: '(?i)(日本|🇯🇵|(^|[^a-z])JP([^a-z]|$)|Japan|Tokyo)'

  - name: 新加坡节点
    type: select
    include-all: true
    empty-fallback: REJECT
    filter: '(?i)(新加坡|狮城|獅城|🇸🇬|(^|[^a-z])SG([^a-z]|$)|Singapore)'

  - name: 美国节点
    type: select
    include-all: true
    empty-fallback: REJECT
    filter: '(?i)(美国|美國|🇺🇸|(^|[^a-z])US([^a-z]|$)|United States|Los Angeles)'

  - name: 韩国节点
    type: select
    include-all: true
    empty-fallback: REJECT
    filter: '(?i)(韩国|韓國|🇰🇷|(^|[^a-z])KR([^a-z]|$)|Korea|Seoul)'

  - name: AI服务
    type: select
    proxies: [节点选择, 美国节点, 日本节点, 香港节点, 自动选择, DIRECT]

  - name: 谷歌服务
    type: select
    proxies: [节点选择, 美国节点, 香港节点, 自动选择, DIRECT]

  - name: YouTube
    type: select
    proxies: [节点选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 美国节点, 自动选择, DIRECT]

  - name: Netflix
    type: select
    proxies: [节点选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 美国节点, 自动选择, DIRECT]

  - name: Disney+
    type: select
    proxies: [节点选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 美国节点, 自动选择, DIRECT]

  - name: Spotify
    type: select
    proxies: [节点选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 美国节点, 自动选择, DIRECT]

  - name: 社交通讯
    type: select
    proxies: [节点选择, 香港节点, 新加坡节点, 美国节点, 自动选择, DIRECT]

  - name: 开发平台
    type: select
    proxies: [节点选择, 香港节点, 日本节点, 美国节点, 自动选择, DIRECT]

  - name: 游戏平台
    type: select
    proxies: [节点选择, 香港节点, 日本节点, 新加坡节点, 美国节点, 自动选择, DIRECT]

  - name: 微软服务
    type: select
    proxies: [节点选择, DIRECT, 自动选择]

  - name: 苹果服务
    type: select
    proxies: [节点选择, DIRECT, 自动选择]

  - name: 金融支付
    type: select
    proxies: [节点选择, 美国节点, 香港节点, 自动选择, DIRECT]

  - name: 国内网站
    type: select
    proxies: [DIRECT, 节点选择]

  - name: 国外网站
    type: select
    proxies: [节点选择, 自动选择, DIRECT]

