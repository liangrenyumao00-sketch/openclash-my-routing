name: Validate and publish stable module

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: routing-module-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.12"

      - name: Install validator dependency
        run: python -m pip install --requirement requirements.txt

      - name: Run structural regression tests
        run: python -m unittest discover -s tests -v

      - name: Download and verify pinned Mihomo
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-v1-v1.19.32.gz \
            --output "$RUNNER_TEMP/mihomo.gz"
          echo "306f81e723e60ce6b828899a6fe83e1d00e9ecefb2dc8d4d849312a5bc00efdc  $RUNNER_TEMP/mihomo.gz" | sha256sum --check --status
          gzip --decompress --stdout "$RUNNER_TEMP/mihomo.gz" > "$RUNNER_TEMP/mihomo"
          chmod 0755 "$RUNNER_TEMP/mihomo"
          "$RUNNER_TEMP/mihomo" -v

      - name: Validate module, providers, and synthetic Mihomo config
        run: >-
          python scripts/validate.py My_Routing.ini
          --core "$RUNNER_TEMP/mihomo"
          --work-dir "$RUNNER_TEMP/openclash-validation"

  publish-stable:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Publish only the validated module and rollback copy
        shell: bash
        run: |
          set -euo pipefail

          latest_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$latest_main" != "$GITHUB_SHA" ]]; then
            echo "A newer main commit exists; this validated revision will not replace stable."
            exit 0
          fi

          source_module="$GITHUB_WORKSPACE/My_Routing.ini"
          seed_previous="$GITHUB_WORKSPACE/previous/My_Routing.ini"
          test -s "$source_module"
          publish_dir="$RUNNER_TEMP/stable-publish"
          if git ls-remote --exit-code --heads origin stable >/dev/null 2>&1; then
            git fetch --no-tags origin refs/heads/stable:refs/remotes/origin/stable
            git worktree add --detach "$publish_dir" refs/remotes/origin/stable
          else
            git worktree add --detach "$publish_dir" "$GITHUB_SHA"
            git -C "$publish_dir" switch --orphan "publish-$GITHUB_RUN_ID"
          fi
          cd "$publish_dir"
          if [[ -s My_Routing.ini ]]; then
            if ! cmp -s My_Routing.ini "$source_module"; then
              cp My_Routing.ini My_Routing.previous.ini
            fi
          elif [[ -s "$seed_previous" ]]; then
            cp "$seed_previous" My_Routing.previous.ini
          fi
          test -s My_Routing.previous.ini || { echo "Missing initial previous/My_Routing.ini seed" >&2; exit 1; }
          cp "$source_module" My_Routing.ini
          sha256sum My_Routing.ini My_Routing.previous.ini > SHA256SUMS

          git add -- My_Routing.ini My_Routing.previous.ini SHA256SUMS
          if git diff --cached --quiet; then
            echo "Stable release is already up to date."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Publish validated routing module"
          git push origin HEAD:refs/heads/stable
